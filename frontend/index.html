<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6b4f" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>ShelfShare | Community Resource Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Google Identity Services (Real Google Sign-In) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML === '')) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b91c1c;background:#fef2f2;border:2px solid #ef4444;border-radius:12px;margin:24px;max-width:800px;">' +
            '<h2 style="margin-top:0">Script Error Caught:</h2>' +
            '<pre style="white-space:pre-wrap;font-family:monospace;background:#fff;padding:12px;border-radius:6px;border:1px solid #fca5a5;">' +
            (e.error ? e.error.stack || e.error.message : e.message) +
            '</pre>' +
            '<button onclick="localStorage.clear();location.reload();" style="padding:8px 16px;background:#ef4444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-top:12px;">Reset Data & Reload</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
